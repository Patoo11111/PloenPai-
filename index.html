<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายรับ-รายจ่าย (Scan OCR)</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai&display=swap" rel="stylesheet">

<style>
body { font-family:'Noto Sans Thai',sans-serif; max-width:480px; margin:auto; background:#f8fafc; padding:20px; }
.field { margin-bottom:15px; }
input, select { width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; }
button { padding:12px; border:none; border-radius:10px; background:#4dabf7; color:white; font-weight:bold; width:100%; }
.preview img { width:100%; border-radius:12px; margin-top:10px; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 20px; border-radius:20px; display:none; }
</style>
</head>

<body>

<h2>💰 บันทึกรายรับรายจ่าย (สแกนสลิปได้)</h2>

<div class="field">
  <label>จำนวนเงิน</label>
  <input type="number" id="amount">
</div>

<div class="field">
  <label>หมายเหตุ</label>
  <input type="text" id="note">
</div>

<div class="field">
  <label>📷 สแกนสลิป</label>
  <input type="file" id="image" accept="image/*" capture="environment">
</div>

<div class="preview" id="preview"></div>

<button onclick="save()">บันทึก</button>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
function toast(msg){
  let t=document.getElementById('toast');
  t.innerText=msg;
  t.style.display='block';
  setTimeout(()=>t.style.display='none',2000);
}

// 🔥 ดึงจำนวนเงินแบบฉลาด
function extractAmount(text){
  let matches = text.match(/\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?/g);
  if(!matches) return null;

  let nums = matches.map(n=>parseFloat(n.replace(/,/g,'')))
                    .filter(n=>n>=10 && n<100000);

  nums.sort((a,b)=>b-a);
  return nums[0] || null;
}

// 📷 OCR scan
document.getElementById('image').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;

  // preview
  document.getElementById('preview').innerHTML =
    `<img src="${URL.createObjectURL(file)}">`;

  toast('กำลังสแกน...');

  try{
    const { data:{ text } } = await Tesseract.recognize(file,'eng+tha');

    console.log(text);

    // 🎯 amount
    const amount = extractAmount(text);
    if(amount){
      document.getElementById('amount').value = amount;
    }

    // 🧠 note
    let note = text.replace(/\s+/g,' ').trim();
    document.getElementById('note').value = note.substring(0,50);

    toast('สแกนสำเร็จ');

  }catch(err){
    toast('สแกนไม่สำเร็จ');
  }
});

function save(){
  const amount = document.getElementById('amount').value;
  const note = document.getElementById('note').value;

  if(!amount){
    toast('กรอกจำนวนเงินก่อน');
    return;
  }

  let data = JSON.parse(localStorage.getItem('data')||'[]');
  data.push({amount,note,date:new Date().toISOString()});
  localStorage.setItem('data',JSON.stringify(data));

  toast('บันทึกแล้ว');

  document.getElementById('amount').value='';
  document.getElementById('note').value='';
  document.getElementById('preview').innerHTML='';
}
</script>

</body>
</html>
