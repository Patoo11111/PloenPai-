<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>รายรับ-รายจ่าย (Pastel Edition)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* ปรับโทนสีเป็น Pastel Blue & Yellow */
  --bg: #fcfdfe; /* พื้นหลังขาวอมฟ้าอ่อน */
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --border: #e2e8f0;
  --text: #334155;
  --text2: #64748b;
  --text3: #94a3b8;
  
  --income: #4ade80; /* เขียวพาสเทล */
  --income-bg: #f0fdf4;
  --expense: #fb7185; /* แดงพาสเทล */
  --expense-bg: #fff1f2;
  
  --accent: #a5d8ff; /* Pastel Blue */
  --accent-dark: #74c0fc;
  --secondary: #fff9db; /* Pastel Yellow */
  --secondary-dark: #ffe066;
  
  --radius: 20px;
  --radius-sm: 12px;
}

* { 
  box-sizing: border-box; 
  margin: 0; padding: 0; 
  -webkit-tap-highlight-color: transparent; 
  font-family: 'Noto Sans Thai', sans-serif; /* ปรับ Font ให้เหมือนกันทั้งแอป */
}

body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 72px;
  max-width: 480px;
  margin: 0 auto;
}

/* Header */
.header { padding: 25px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.month-label { font-size: 13px; color: var(--text2); margin-top: 2px; }

.sync-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--secondary); border: 1px solid var(--secondary-dark);
  border-radius: 20px; padding: 6px 14px;
  font-size: 12px; font-weight: 600; color: #856404; cursor: pointer;
  transition: all 0.2s;
}
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--secondary-dark); }
.sync-btn.syncing .sync-dot { background: #f59e0b; animation: blink 0.8s infinite; }
.sync-btn.ok { background: var(--income-bg); border-color: var(--income); color: #166534; }
.sync-btn.ok .sync-dot { background: var(--income); }

/* Hero Section - ปรับเป็น Pastel Blue */
.hero {
  margin: 10px 20px 20px;
  background: linear-gradient(135deg, var(--accent) 0%, #d0ebff 100%);
  border-radius: var(--radius); padding: 25px;
  box-shadow: 0 10px 15px -3px rgba(165, 216, 255, 0.3);
  position: relative; overflow: hidden;
}
.hero::before { content:''; position:absolute; right:-10px; top:-10px; width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,0.3); }
.hero-label { font-size: 12px; font-weight: 600; color: #495057; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.hero-balance { font-size: 38px; font-weight: 800; color: #1c7ed6; letter-spacing: -1px; }
.hero-balance.neg { color: #e03131; }

.hero-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.hero-stat { background: rgba(255, 255, 255, 0.5); border-radius: 15px; padding: 12px; backdrop-filter: blur(5px); }
.hero-stat-label { font-size: 11px; font-weight: 600; color: #495057; margin-bottom: 2px; }
.hero-stat-val { font-size: 16px; font-weight: 700; }
.hero-stat-val.inc { color: #2b8a3e; }
.hero-stat-val.exp { color: #c92a2a; }

/* Tabs */
.tabs { display: flex; margin: 0 20px 20px; background: #e9ecef; border-radius: 15px; padding: 5px; }
.tab { 
    flex: 1; padding: 10px; font-size: 14px; font-weight: 600; 
    background: transparent; border: none; color: #adb5bd; 
    cursor: pointer; border-radius: 10px; transition: all 0.2s; 
}
.tab.active { background: var(--surface); color: #1c7ed6; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

/* Form Elements */
.section { display: none; padding: 0 20px; }
.section.active { display: block; }

.type-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.type-btn { 
    padding: 14px; font-size: 15px; font-weight: 600; border-radius: var(--radius-sm); 
    border: 2px solid var(--border); background: var(--surface); color: var(--text2); 
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; 
}
.type-btn.active.exp-btn { background: var(--expense-bg); border-color: var(--expense); color: var(--expense); }
.type-btn.active.inc-btn { background: var(--income-bg); border-color: var(--income); color: var(--income); }

.field { margin-bottom: 16px; }
.field label { font-size: 12px; font-weight: 700; color: var(--text2); display: block; margin-bottom: 8px; }
.field input, .field select {
  width: 100%; background: var(--surface); border: 2px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 16px; color: var(--text);
  font-size: 15px; transition: all 0.2s;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--accent-dark); box-shadow: 0 0 0 4px rgba(165, 216, 255, 0.2); }
.amount-field input { font-size: 32px; font-weight: 800; color: var(--text); text-align: center; }

/* Submit Button - Pastel Blue */
.submit { 
    width: 100%; padding: 16px; margin-top: 10px; 
    background: var(--accent-dark); color: white; border: none; 
    border-radius: var(--radius-sm); font-size: 17px; font-weight: 700; 
    cursor: pointer; box-shadow: 0 4px 6px rgba(116, 192, 252, 0.3);
    transition: all 0.2s; 
}
.submit:active { transform: translateY(2px); box-shadow: none; }

/* History & Others */
.tx-item { 
    display: flex; justify-content: space-between; align-items: center; 
    padding: 15px; background: var(--surface); border: 1.5px solid var(--border); 
    border-radius: var(--radius-sm); margin-bottom: 10px; transition: transform 0.2s;
}
.tx-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.tx-name { font-size: 15px; font-weight: 600; color: var(--text); }
.tx-amount { font-size: 16px; font-weight: 700; }
.tx-amount.inc { color: #2b8a3e; }
.tx-amount.exp { color: #c92a2a; }

/* Setup Banner */
.setup-banner { 
    margin-bottom: 20px; background: var(--secondary); border: 2px dashed var(--secondary-dark); 
    border-radius: var(--radius-sm); padding: 15px; font-size: 13px; color: #856404; 
}
.setup-input-row button { background: #856404; color: white; border-radius: 8px; padding: 8px 15px; border: none; font-weight: 600; }

/* Toast */
.toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
    background: var(--text); color: white; border-radius: 50px; 
    padding: 12px 25px; font-size: 14px; font-weight: 600; z-index: 100;
    opacity: 0; transition: 0.3s;
}
.toast.show { opacity: 1; bottom: 50px; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>คุมบัญชี</h1>
    <div class="month-label" id="cur-month"></div>
  </div>
  <button class="sync-btn" id="sync-btn" onclick="syncNow()">
    <span class="sync-dot"></span>
    <span id="sync-label">ซิงค์ข้อมูล</span>
  </button>
</div>

<div class="hero">
  <div class="hero-label">ยอดเงินคงเหลือ</div>
  <div class="hero-balance" id="h-bal">฿0</div>
  <div class="hero-sub">
    <div class="hero-stat">
      <div class="hero-stat-label">รายรับเดือนนี้</div>
      <div class="hero-stat-val inc" id="h-inc">฿0</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-label">รายจ่ายเดือนนี้</div>
      <div class="hero-stat-val exp" id="h-exp">฿0</div>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('add')">จดบันทึก</button>
  <button class="tab" onclick="switchTab('history')">ประวัติ</button>
  <button class="tab" onclick="switchTab('summary')">ภาพรวม</button>
</div>

<div id="tab-add" class="section active">
  <div class="setup-banner" id="setup-banner" style="display:none;">
    <strong>เชื่อมต่อ Google Sheets</strong><br>
    กรุณาวาง URL ของ Apps Script เพื่อเริ่มใช้งานซิงค์ข้อมูล
    <div style="display:flex; gap:8px; margin-top:10px;">
      <input type="text" id="api-url-input" style="flex:1; padding:8px; border-radius:8px; border:1px solid #ffe066;" placeholder="https://script.google.com/...">
      <button onclick="saveApiUrl()" style="background:#fcc419; color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:700;">เชื่อมต่อ</button>
    </div>
  </div>

  <div class="type-row">
    <button class="type-btn exp-btn active" id="btn-exp" onclick="setType('expense')">📤 รายจ่าย</button>
    <button class="type-btn inc-btn" id="btn-inc" onclick="setType('income')">📥 รายรับ</button>
  </div>

  <div class="field amount-field">
    <label>จำนวนเงิน (บาท)</label>
    <input type="number" id="f-amount" placeholder="0.00" min="0" inputmode="decimal">
  </div>

  <div class="field">
    <label>วันที่รายการ</label>
    <input type="date" id="f-date">
  </div>

  <div class="field">
    <label>หมวดหมู่</label>
    <select id="f-cat"></select>
  </div>

  <div class="field">
    <label>หมายเหตุ / รายละเอียด</label>
    <input type="text" id="f-note" placeholder="เช่น กาแฟเช้า, ค่ารถ">
  </div>

  <button class="submit" id="submit-btn" onclick="addTransaction()">บันทึกรายการ</button>
</div>

<div id="tab-history" class="section">
  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <select id="f-type" onchange="renderHistory()" style="flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--border);">
      <option value="all">ทุกประเภท</option>
      <option value="expense">รายจ่าย</option>
      <option value="income">รายรับ</option>
    </select>
    <select id="f-month" onchange="renderHistory()" style="flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--border);"></select>
  </div>
  <div id="tx-list"></div>
</div>

<div id="tab-summary" class="section">
  <div class="field" style="margin-bottom:20px;">
    <select id="s-month" onchange="renderSummary()"></select>
  </div>
  
  <div style="background:white; padding:20px; border-radius:20px; border:1.5px solid var(--border); margin-bottom:20px;">
    <div style="height:200px;">
        <canvas id="barChart"></canvas>
    </div>
  </div>

  <div id="cat-list"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let APPS_SCRIPT_URL = localStorage.getItem('appsScriptUrl') || '';
const expenseCats = ['อาหาร','เดินทาง','ที่พัก','สุขภาพ','ช้อปปิ้ง','บันเทิง','การศึกษา','อื่นๆ'];
const incomeCats  = ['เงินเดือน','ฟรีแลนซ์','ธุรกิจ','ดอกเบี้ย','ของขวัญ','อื่นๆ'];
const icons = {อาหาร:'🍜',เดินทาง:'🚗',ที่พัก:'🏠',สุขภาพ:'💊',ช้อปปิ้ง:'🛍️',บันเทิง:'🎬',การศึกษา:'📚',เงินเดือน:'💼',ฟรีแลนซ์:'💻',ธุรกิจ:'📊',ดอกเบี้ย:'🏦',ของขวัญ:'🎁',อื่นๆ:'📌'};
const monthsFull  = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

let transactions = JSON.parse(localStorage.getItem('txCache') || '[]');
let currentType = 'expense';
let barInst = null;

function todayParts() { const d=new Date(); return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()}; }

function init() {
  const {y,m,d} = todayParts();
  document.getElementById('f-date').value = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  document.getElementById('cur-month').textContent = monthsFull[m-1] + ' ' + (y+543);
  setType('expense');
  populateMonthSelects();
  updateMetrics();
  if(!APPS_SCRIPT_URL) document.getElementById('setup-banner').style.display = 'block';
  else syncNow();
}

function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>{t.classList.remove('show');},2000);
}

function setType(type) {
  currentType = type;
  document.getElementById('btn-exp').classList.toggle('active', type==='expense');
  document.getElementById('btn-inc').classList.toggle('active', type==='income');
  document.getElementById('f-cat').innerHTML = (type==='expense'?expenseCats:incomeCats).map(c=>`<option>${c}</option>`).join('');
}

function populateMonthSelects() {
  const s = new Set(transactions.map(t=>t.date.slice(0,7)));
  const {y,m} = todayParts(); s.add(`${y}-${String(m).padStart(2,'0')}`);
  const sorted = Array.from(s).sort().reverse();
  const options = sorted.map(ym => {
    const [y,m] = ym.split('-');
    return `<option value="${ym}">${monthsFull[m-1]} ${parseInt(y)+543}</option>`;
  }).join('');
  document.getElementById('f-month').innerHTML = options;
  document.getElementById('s-month').innerHTML = options;
}

function updateMetrics() {
  const {y,m} = todayParts(); const ym = `${y}-${String(m).padStart(2,'0')}`;
  const curr = transactions.filter(t=>t.date.startsWith(ym));
  const inc = curr.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  const exp = curr.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const bal = inc-exp;
  document.getElementById('h-inc').textContent = '฿'+inc.toLocaleString();
  document.getElementById('h-exp').textContent = '฿'+exp.toLocaleString();
  const bEl = document.getElementById('h-bal');
  bEl.textContent = (bal<0?'-':'') + '฿' + Math.abs(bal).toLocaleString();
  bEl.className = 'hero-balance' + (bal<0?' neg':'');
}

async function addTransaction() {
  const amount = parseFloat(document.getElementById('f-amount').value);
  const date = document.getElementById('f-date').value;
  const cat = document.getElementById('f-cat').value;
  const note = document.getElementById('f-note').value.trim() || cat;
  if(!amount || !date) { showToast('กรุณากรอกข้อมูลให้ครบ'); return; }

  const tx = {id:Date.now().toString(), type:currentType, amount, date, cat, note};
  transactions.unshift(tx);
  localStorage.setItem('txCache', JSON.stringify(transactions));
  
  document.getElementById('f-amount').value = '';
  document.getElementById('f-note').value = '';
  updateMetrics(); showToast('บันทึกสำเร็จ');

  if(APPS_SCRIPT_URL) {
    try {
      fetch(APPS_SCRIPT_URL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:'add', row:[tx.id, tx.type, tx.amount, tx.date, tx.cat, tx.note]})});
    } catch(e) {}
  }
}

async function syncNow() {
  if(!APPS_SCRIPT_URL) return;
  const label = document.getElementById('sync-label');
  const btn = document.getElementById('sync-btn');
  btn.className = 'sync-btn syncing'; label.textContent = 'กำลังซิงค์...';
  try {
    const res = await fetch(APPS_SCRIPT_URL+'?action=get');
    const data = await res.json();
    if(data.rows) {
      transactions = data.rows.map(r=>({id:r[0], type:r[1], amount:parseFloat(r[2]), date:r[3], cat:r[4], note:r[5]}));
      localStorage.setItem('txCache', JSON.stringify(transactions));
      updateMetrics(); populateMonthSelects();
      btn.className = 'sync-btn ok'; label.textContent = 'ซิงค์เรียบร้อย';
    }
  } catch(e) {
    btn.className = 'sync-btn'; label.textContent = 'ซิงค์ข้อมูล';
    showToast('การซิงค์ขัดข้อง');
  }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['add','history','summary'][i]===name));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='history') renderHistory();
  if(name==='summary') renderSummary();
}

function renderHistory() {
  const typeF = document.getElementById('f-type').value;
  const monthF = document.getElementById('f-month').value;
  let data = transactions.filter(t=>t.date.startsWith(monthF));
  if(typeF!=='all') data = data.filter(t=>t.type===typeF);
  
  const container = document.getElementById('tx-list');
  if(!data.length) { container.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8;">ไม่พบข้อมูล</div>'; return; }
  
  container.innerHTML = data.map(t=>`
    <div class="tx-item">
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="tx-icon" style="background:${t.type==='income'?'#f0fdf4':'#fff1f2'}">${icons[t.cat]||'📌'}</div>
        <div>
          <div class="tx-name">${t.note}</div>
          <div style="font-size:11px; color:#94a3b8;">${t.date} • ${t.cat}</div>
        </div>
      </div>
      <div class="tx-amount ${t.type==='income'?'inc':'exp'}">
        ${t.type==='income'?'+':'-'}฿${t.amount.toLocaleString()}
      </div>
    </div>
  `).join('');
}

function renderSummary() {
  const ym = document.getElementById('s-month').value;
  const data = transactions.filter(t=>t.date.startsWith(ym));
  const expData = data.filter(t=>t.type==='expense');
  const cats = {}; expData.forEach(t=>{cats[t.cat]=(cats[t.cat]||0)+t.amount;});
  const sorted = Object.entries(cats).sort((a,b)=>b[1]-a[1]);

  if(barInst) barInst.destroy();
  const ctx = document.getElementById('barChart').getContext('2d');
  barInst = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: sorted.map(c=>c[0]),
      datasets: [{
        data: sorted.map(c=>c[1]),
        backgroundColor: ['#a5d8ff', '#ffec99', '#b2f2bb', '#ffc9c9', '#eebefa', '#d8f5a2']
      }]
    },
    options: { maintainAspectRatio:false, plugins:{legend:{position:'right',labels:{font:{family:'Noto Sans Thai'}}}} }
  });

  document.getElementById('cat-list').innerHTML = sorted.map(([cat, amt]) => `
    <div style="display:flex; justify-content:space-between; padding:12px; background:white; border-radius:12px; margin-bottom:8px; border:1px solid var(--border);">
      <span style="font-weight:600;">${icons[cat]||''} ${cat}</span>
      <span style="color:var(--expense); font-weight:700;">฿${amt.toLocaleString()}</span>
    </div>
  `).join('');
}

function saveApiUrl() {
    const url = document.getElementById('api-url-input').value;
    if(url) {
        localStorage.setItem('appsScriptUrl', url);
        APPS_SCRIPT_URL = url;
        document.getElementById('setup-banner').style.display = 'none';
        syncNow();
    }
}

init();
</script>
</body>
</html>
